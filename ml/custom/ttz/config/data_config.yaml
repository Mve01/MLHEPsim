data_config:
  data_name: ttz
  input_dim: 15  # Z_Lepton1 (Pt,Eta,Phi=3) + Z_Lepton2(3) + W_Lepton(3) + BJet(Pt,Eta,Phi,Mass=4) + MET(MET,Phi=2)
  base_distribution: normal
  train_split: 0.8
  val_split: 0.5
  
  # BSM weighting options
  load_weights: true   # Load smeft_weights from ROOT file (set to true to enable BSM weighting)
  use_weights: true    # Use weights during training
  
  # SMEFT weight decomposition: w_eft = w_sm + c*w_lin + c^2*w_quad (with c=5.0)
  # weight_type options:
  #   "full"      - Use full SMEFT weight at cHt=5.0 (smeft_weights[:, 124])
  #   "sm"        - Use SM weight only (w_sm from eventWeight)
  #   "linear"    - Use linear term only: w_lin = (w_plus - w_minus) / 10.0
  #   "quadratic" - Use quadratic term only: w_quad = (w_plus + w_minus - 2*w_sm) / 50.0
  weight_type: "linear"           # Which weight component to use for training

  input_processing:
    shuffle: True
    keep_ratio: 1.0
    hold_mode: False
    use_hold: False
    hold_ratio: 0.5

  feature_selection:
    n_data: null  #for testing use 100000 & null for all data during actual training 
    keep_names: ["Z_Lepton1_Pt","Z_Lepton1_Eta","Z_Lepton1_Phi",
      "Z_Lepton2_Pt","Z_Lepton2_Eta","Z_Lepton2_Phi",
      "W_Lepton_Pt","W_Lepton_Eta","W_Lepton_Phi",
      "BJet_Pt","BJet_Eta","BJet_Phi","BJet_Mass",
      "MET","MET_Phi"] 

  dataloader_config:
    batch_size: 2048
    num_workers: 16 # Use -1 to use all available cores (uses much more RAM)
    pin_memory: False # Set to True to speed up GPU transfer (uses more CPU RAM only use if enough available) !!Tried True and was slower??
    drop_last: True
    persistent_workers: False  # Don't keep workers alive to save memory

  preprocessing:
    cont_rescale_type: gauss_rank
    disc_rescale_type: null
    no_process: ["weight"]  # Skip weights only
    # NOTE: Using direct pt/eta/phi coordinates
    # All kinematic features are treated as continuous in variables.json
    
    # Feature order: Z_Lepton1 → Z_Lepton2 → W_Lepton → BJet → MET (physics-motivated grouping)
